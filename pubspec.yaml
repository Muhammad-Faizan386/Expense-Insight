name: expense_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/waiting.png

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/fonts/OpenSans-Bold.ttf
          weight: 700